<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Admin</title>

  <link
    rel="stylesheet"
    href="create-admin.css"
  >

</head>

<body>

<div class="container">

  <form id="createAdminForm">

    <h1>Create Admin</h1>

    <input
      type="text"
      id="fullname"
      placeholder="Full Name"
      required
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Create Admin
    </button>

    <p id="message"></p>

  </form>

</div>

<script src="create-admin.js"></script>

</body>
</html>
