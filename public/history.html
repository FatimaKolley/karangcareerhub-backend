<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>History | KarangCareerHub</title>

  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="history.css" />
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">

    <div class="logo">
      <h2>KarangCareerHub</h2>
    </div>

    <div class="nav-right">

      <button id="darkModeToggle" class="dark-btn">
        🌙
      </button>

      <div class="profile-container">

        <img
          id="userProfilePic"
          src="image/avatar-placeholder.png"
          class="avatar"
        />

        <div id="dropdownMenu" class="profile-dropdown">
          <ul>
            <li><a href="dashboardStudent.html">Dashboard</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="settings.html">Settings</a></li>

            <li class="divider"></li>

            <li>
              <a href="#" id="logoutBtn">Logout</a>
            </li>
          </ul>
        </div>

      </div>
    </div>

  </nav>

  <!-- ================= PAGE ================= -->
  <main class="history-page">

    <!-- PAGE HEADER -->
    <section class="page-header">

      <div>
        <h1>📄 Activity History</h1>
        <p>Track your applications and viewed jobs.</p>
      </div>

      <div class="history-search">
        <input
          type="text"
          id="searchInput"
          placeholder="Search jobs..."
        />
      </div>

    </section>

    <!-- ================= STATS ================= -->
    <section class="stats-grid">

      <div class="stat-card">
        <h3 id="applicationsCount">0</h3>
        <p>Applications</p>
      </div>

      <div class="stat-card">
        <h3 id="viewsCount">0</h3>
        <p>Viewed Jobs</p>
      </div>
    </section>

    <!-- ================= APPLICATIONS ================= -->
    <section class="history-section">

      <div class="section-header">
        <h2>📨 Applied Jobs</h2>
      </div>

      <div id="applicationsList" class="history-grid"></div>

    </section>

    <!-- ================= VIEWED JOBS ================= -->
    <section class="history-section">

      <div class="section-header">
        <h2>👁 Viewed Jobs</h2>
      </div>

      <div id="viewedJobsList" class="history-grid"></div>

    </section>

  </main>

  <script src="history.js"></script>
  <script src="studentTheme.js"></script>

</body>
</html>
